<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>


<body>
    
    <h1>Cadastro de Clientes</h1>

    <hr>
    <br>

    <form action="" id="formCliente">

        <label for="nome">Nome: </label>
        <input type="text" id="nome" placeholder="nome completo" required>
        
        <br><br>

        <p>Gênero: </p>

        <input type="radio" id="masc" name="genero" value="M">
        <label for="masc">Masculino</label>

        <input type="radio" id="fem" name="genero" value="F">
        <label for="fem">Feminino</label>

        <input type="radio" id="enby" name="genero" value="NB">
        <label for="enby">Não-binário</label>
        
        <br><br>

        <label for="email">E-mail: </label>
        <input type="email" id="email" placeholder="Seu e-mail">

        <br><br>

        <label for="cpf">CPF: </label>
        <input type="text" id="cpf" minlength="11" maxlength="11" placeholder="Apenas núms." required>

        <br><br>

        <label for="end">Endereço: </label>
        <hr>
        <br>
        <label for="log">Logradouro: </label>
        <input type="text" id="log" placeholder="rua; avenida; servidão, etc.">

        <label for="num">Número: </label>
        <input type="text" id="num">
        <input type="text" id="comp" placeholder="Complemento">

        <br><br>

        <label for="bairro">Bairro: </label>
        <input type="text" id="bairro">

        <br><br>

        <label for="cidade">Cidade: </label>
        <input type="text" id="cidade">

        <br><br>

        <label for="uf">UF: </label>
        <select name="uf" id="uf">
            <option value="">--Escolha uma opção--</option>
            <option value="sc">SC</option>
            <option value="pr">PR</option>
            <option value="rs">RS</option>
        </select>

        <br><br>

        <label for="cep">CEP: </label>
        <input type="text" id="cep" minlength="8" maxlength="8" placeholder="Apenas números.">

        <br><br>

        <button type="submit">Cadastrar</button>

    </form>

    <script src="script.js"></script>
    
</body>


</html>
